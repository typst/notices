# Builds the `notices` binary for the platforms the GitHub Action supports and
# attaches it, together with SHA-256 checksums, to the release of the pushed
# tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: notices-linux-x86_64
          - runner: ubuntu-22.04-arm
            asset: notices-linux-aarch64
          - runner: macos-26
            asset: notices-macos-aarch64
          - runner: windows-2025
            asset: notices-windows-x86_64.exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check action version
        shell: bash
        run: |
          default=$(sed -n 's/^    default: \(v[0-9].*\)$/\1/p' action.yml)
          if [[ "$default" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The default of the version input in action.yml is $default, expected $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      # The binary links dynamically against the glibc of the build image, so
      # it needs glibc 2.35 or newer. That covers GitHub-hosted runners, but
      # not older container images.
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --features cargo,serde
          exe=target/release/notices
          [[ "$RUNNER_OS" == Windows ]] && exe+=.exe
          mkdir dist
          cp "$exe" "dist/${{ matrix.asset }}"
      # The binaries are released with a NOTICE file for their dependencies,
      # created by the binary itself. `.cargo/notices.toml` covers the targets of
      # all builds, so one of them suffices.
      - name: Create NOTICE
        if: matrix.asset == 'notices-linux-x86_64'
        run: |
          target/release/notices check --deps --allow-missing --locked --features cargo,serde
          target/release/notices release --locked --features cargo,serde -o dist/NOTICE,dist/NOTICE.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        working-directory: dist
        run: sha256sum notices-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
